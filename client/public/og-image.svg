<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Savewise — Build the habit. Reach the goal.">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12503a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c9722b" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12503a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#12503a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#f9f7f3"/>
  <rect width="1200" height="630" fill="url(#wash)"/>

  <!-- Mark -->
  <rect x="80" y="80" width="72" height="72" rx="19" fill="#12503a"/>
  <rect x="100" y="121" width="8" height="14" rx="4" fill="#f9f7f3" opacity="0.55"/>
  <rect x="112" y="111" width="8" height="24" rx="4" fill="#f9f7f3" opacity="0.8"/>
  <rect x="124" y="99" width="8" height="36" rx="4" fill="#f9f7f3"/>
  <text x="172" y="130" font-family="Georgia, serif" font-size="42" fill="#111917">Savewise</text>

  <!-- Headline -->
  <text x="80" y="300" font-family="Georgia, serif" font-size="82" fill="#111917">Build the habit.</text>
  <text x="80" y="392" font-family="Georgia, serif" font-size="82" fill="#12503a">Reach the goal.</text>

  <text x="80" y="462" font-family="system-ui, sans-serif" font-size="28" fill="#5f6764">
    Savings goals with real deadlines, budgets you can keep,
  </text>
  <text x="80" y="502" font-family="system-ui, sans-serif" font-size="28" fill="#5f6764">
    and plain-English insights from your own numbers.
  </text>

  <!-- A rising savings line, matching the product's hero visual -->
  <path d="M760 470 L820 452 L880 458 L940 424 L1000 408 L1060 386 L1120 356 L1120 520 L760 520 Z" fill="url(#line)"/>
  <path d="M760 470 L820 452 L880 458 L940 424 L1000 408 L1060 386 L1120 356"
        fill="none" stroke="#12503a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1120" cy="356" r="8" fill="#12503a" stroke="#f9f7f3" stroke-width="4"/>

  <text x="80" y="570" font-family="system-ui, sans-serif" font-size="20" fill="#8a908d">
    A planning tool. Savewise never holds or moves your money.
  </text>
</svg>
